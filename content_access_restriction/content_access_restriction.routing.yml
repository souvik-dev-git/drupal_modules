content_access_restriction.admin:
  path: '/admin/config/content/content-access-restriction'
  defaults:
    _controller: '\Drupal\content_access_restriction\Controller\ContentAccessRestrictionController::overview'
    _title: 'Content Access Restriction'
  requirements:
    _permission: 'administer content access restriction'

content_access_restriction.settings:
  path: '/admin/config/content/content-access-restriction/settings'
  defaults:
    _form: '\Drupal\content_access_restriction\Form\ContentAccessRestrictionSettingsForm'
    _title: 'Settings'
  requirements:
    _permission: 'administer content access restriction settings'

content_access_restriction.restricted_content:
  path: '/admin/config/content/content-access-restriction/restricted-content'
  defaults:
    _controller: '\Drupal\content_access_restriction\Controller\ContentAccessRestrictionController::restrictedContent'
    _title: 'Restricted Content'
  requirements:
    _permission: 'view restricted content'